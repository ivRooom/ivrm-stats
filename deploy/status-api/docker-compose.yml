services:
  status-api:
    image: ghcr.io/ivrooom/ivrm-stats-api:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ivrm-status-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STATUS_DB_PATH: /data/status.db
      MINECRAFT_CURRENT_PATH: /data/minecraft/current.json
      MINECRAFT_HISTORY_PATH: /data/minecraft/history.json
      STATUS_ENABLE_DOCS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - /opt/ivrm/www/stats/api:/data/minecraft:ro
    networks:
      caddy:
        aliases:
          - status-api
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK_NAME:?CADDY_NETWORK_NAME is required}
