name: Status API Quality Check

on:
  pull_request:
    paths:
      - "services/status-api/**"
      - "deploy/status-api/**"
      - "scripts/configure-caddy-status-api.sh"
      - "scripts/deploy-status-api-oci.sh"
      - "scripts/send-test-status.py"
      - ".github/workflows/status-api-ci.yml"
      - ".github/workflows/deploy-status-api.yml"
  push:
    branches:
      - main
    paths:
      - "services/status-api/**"
      - "deploy/status-api/**"
      - "scripts/configure-caddy-status-api.sh"
      - "scripts/deploy-status-api-oci.sh"
      - "scripts/send-test-status.py"
      - ".github/workflows/status-api-ci.yml"
      - ".github/workflows/deploy-status-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/status-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/status-api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile application
        run: python -m compileall -q app tests

      - name: Run tests
        run: pytest

      - name: Validate deployment scripts
        working-directory: .
        run: |
          bash -n scripts/configure-caddy-status-api.sh
          bash -n scripts/deploy-status-api-oci.sh
          python3 -m py_compile scripts/send-test-status.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/status-api/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ivrm-stats-api
          cache-to: type=gha,mode=max,scope=ivrm-stats-api
